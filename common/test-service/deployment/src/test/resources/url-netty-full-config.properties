quarkus.fake-service.endpoint-override=http://localhost:8000
quarkus.fake-service.api-call-timeout=0.5S
quarkus.fake-service.api-call-attempt-timeout=0.5S

quarkus.fake-service.aws.region=us-east-2
quarkus.fake-service.aws.credentials.type=static
quarkus.fake-service.aws.credentials.static-provider.access-key-id=test-key
quarkus.fake-service.aws.credentials.static-provider.secret-access-key=test-secret

quarkus.fake-service.sync-client.type = url
quarkus.fake-service.sync-client.connection-timeout = 0.100S
quarkus.fake-service.sync-client.socket-timeout = 0.100S
quarkus.fake-service.sync-client.tls-trust-managers-provider.type=system-property

quarkus.fake-service.async-client.type = netty
quarkus.fake-service.async-client.max-concurrency=10
quarkus.fake-service.async-client.max-pending-connection-acquires=10
quarkus.fake-service.async-client.read-timeout=0.01S
quarkus.fake-service.async-client.write-timeout=0.01S
quarkus.fake-service.async-client.connection-timeout=0.01S
quarkus.fake-service.async-client.connection-acquisition-timeout=0.01S
quarkus.fake-service.async-client.connection-time-to-live=0.01S
quarkus.fake-service.async-client.connection-max-idle-time=0.01S
quarkus.fake-service.async-client.use-idle-connection-reaper=false
quarkus.fake-service.async-client.tcp-keep-alive=true
quarkus.fake-service.async-client.protocol = http1-1
quarkus.fake-service.async-client.http2.max-streams = 10
quarkus.fake-service.async-client.http2.initial-window-size = 10
quarkus.fake-service.async-client.http2.health-check-ping-period = 10
quarkus.fake-service.async-client.ssl-provider = jdk
quarkus.fake-service.async-client.event-loop.override = true
quarkus.fake-service.async-client.event-loop.number-of-threads = 5
quarkus.fake-service.async-client.event-loop.thread-name-prefix = Quarkus-Netty-EventLoop-
quarkus.fake-service.async-client.proxy.enabled = true
quarkus.fake-service.async-client.proxy.endpoint = http://127.1.1.1
quarkus.fake-service.async-client.proxy.non-proxy-hosts = localhost, hostlocal
quarkus.fake-service.async-client.tls-key-managers-provider.type=system-property
quarkus.fake-service.async-client.tls-trust-managers-provider.type=system-property
