quarkus.fake-service.endpoint-override=http://localhost:8000
quarkus.fake-service.api-call-timeout=0.5S
quarkus.fake-service.api-call-attempt-timeout=0.5S

quarkus.fake-service.aws.region=us-east-2
quarkus.fake-service.aws.credentials.type=static
quarkus.fake-service.aws.credentials.static-provider.access-key-id=test-key
quarkus.fake-service.aws.credentials.static-provider.secret-access-key=test-secret

quarkus.fake-service.sync-client.type = apache
quarkus.fake-service.sync-client.connection-timeout = 0.100S
quarkus.fake-service.sync-client.socket-timeout = 0.100S
quarkus.fake-service.sync-client.tls-key-managers-provider.type=system-property
quarkus.fake-service.sync-client.tls-trust-managers-provider.type=system-property

quarkus.fake-service.sync-client.apache.connection-acquisition-timeout = 0.100S
quarkus.fake-service.sync-client.apache.connection-max-idle-time = 0.100S
quarkus.fake-service.sync-client.apache.connection-time-to-live = 0.100S
quarkus.fake-service.sync-client.apache.max-connections = 10
quarkus.fake-service.sync-client.apache.expect-continue-enabled = true
quarkus.fake-service.sync-client.apache.use-idle-connection-reaper = true
quarkus.fake-service.sync-client.apache.tcp-keep-alive = true
quarkus.fake-service.sync-client.apache.proxy.enabled = true
quarkus.fake-service.sync-client.apache.proxy.endpoint = http://127.1.1.1
quarkus.fake-service.sync-client.apache.proxy.username = foo
quarkus.fake-service.sync-client.apache.proxy.password = bar
quarkus.fake-service.sync-client.apache.proxy.ntlm-domain = foo-domainn
quarkus.fake-service.sync-client.apache.proxy.ntlm-workstation = foo-workstation
quarkus.fake-service.sync-client.apache.proxy.preemptive-basic-authentication-enabled = true
quarkus.fake-service.sync-client.apache.proxy.non-proxy-hosts = localhost, hostlocal

quarkus.fake-service.async-client.type = aws-crt
quarkus.fake-service.async-client.max-concurrency=10
quarkus.fake-service.async-client.connection-timeout=0.01S
quarkus.fake-service.async-client.connection-max-idle-time=0.01S
quarkus.fake-service.async-client.proxy.enabled = true
quarkus.fake-service.async-client.proxy.endpoint = http://127.1.1.1
