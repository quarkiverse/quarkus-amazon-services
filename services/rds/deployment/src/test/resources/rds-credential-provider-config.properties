# use the quarkus client (the default), configured by devservices
quarkus.rds.credentials-provider.test-provider-quarkus.username=myiam
quarkus.rds.credentials-provider.test-provider-quarkus.hostname=myhost
quarkus.rds.credentials-provider.test-provider-quarkus.port=15

# select a named client at build time; its settings and the provider values are runtime configuration
quarkus.rds.credentials-provider.test-provider-named.name=iam
quarkus.rds.credentials-provider.test-provider-named.username=iam-user
quarkus.rds.credentials-provider.test-provider-named.hostname=iam-host
quarkus.rds.credentials-provider.test-provider-named.port=5432
quarkus.rds.iam.aws.region=us-west-2
quarkus.rds.iam.aws.credentials.type=static
quarkus.rds.iam.aws.credentials.static-provider.access-key-id=iam-test-key
quarkus.rds.iam.aws.credentials.static-provider.secret-access-key=iam-test-secret
